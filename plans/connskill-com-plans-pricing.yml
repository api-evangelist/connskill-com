description: 'No tiers, no subscriptions, no account: every one of the 87 endpoints is priced individually and paid
  per call in USDC on Base (eip155:8453) via x402 to 0x43B85AE58f0A2505c710Bc715d6f3EB16b1f63dE. 46 endpoints are
  free; paid prices run from 0.005 to 18 USDC, 5 of them dynamic (the 402 challenge binds the exact amount). One
  free sample per endpoint per UTC day via x-free-sample: 1 on endpoints priced 0.15 USDC or less. Plans below mirror
  the provider''s own lanes.'
plan_count: 8
currency: USDC
network: eip155:8453
payTo: '0x43B85AE58f0A2505c710Bc715d6f3EB16b1f63dE'
model: pay-per-call via x402 — no account, no API key, no signup
free_sample:
  header: 'x-free-sample: 1'
  quota: 1 per endpoint per UTC day
  eligibility: endpoints priced <= 0.15 USDC
policy:
  operator: CONNSKILL GmbH & Co. KG
  jurisdiction: Germany (EU)
  contact: info@connskill.com
  auth: No account or API key. Manual first purchases and private redelivery require a free Sign-In-With-X wallet
    proof from POST /v1/payments/challenge.
  payment: x402 v2, USDC on Base (eip155:8453), pay-per-call to 0x43B85AE58f0A2505c710Bc715d6f3EB16b1f63dE
  idempotency: A fresh wallet proof bound to the exact original request and payment references can retrieve its
    retained private result without another payment.
  redelivery: Private redelivery only reads a retained result. A missing result or uncertain purchase remains held
    for wallet support; it never starts another provider order.
  refund: On-chain settlement is technically final. This does not exclude statutory claims. Invalid input is rejected
    before settlement; failed delivery must be resolved through the delivery policy and support.
  unclearState: If a purchase times out and we cannot tell whether the provider charged us, you get HTTP 504 with
    stateUnclear — so you never blindly re-order.
  timeouts: No uptime SLA. Every outbound call has a timeout (provider 20s, DataForSEO 45s, purchase 60s); the gateway
    hard-caps at 90s and returns 504 rather than hanging.
  rateLimit: Paid service calls have no per-caller rate limit. Wallet challenges have bounded capacity and can return
    429. Request size limits apply. We never log your IP; only technical metadata such as User-Agent and Referer.
  discovery: https://agent.connskill.com/openapi.json · https://agent.connskill.com/.well-known/x402 · https://agent.connskill.com/llms.txt
    · https://agent.connskill.com/pricing
