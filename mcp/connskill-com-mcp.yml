source: https://agent.connskill.com/mcp (tools/list and initialize probed 2026-09-19); https://registry.npmjs.org/@connskill%2Fmcp-growth-services;
  https://github.com/CONN-SKILL/connskill-growth-mcp; https://registry.modelcontextprotocol.io/v0.1/servers/io.github.CONN-SKILL%2Fconnskill-growth-mcp/versions/latest
description: 'CONNSKILL ships the same tool surface two ways: a hosted Streamable-HTTP MCP endpoint at https://agent.connskill.com/mcp
  (POST-only JSON-RPC; a GET answers 405 {"error":"streamable_http_post_only"}; server-to-client streams are not
  offered) and a local stdio server published to npm as @connskill/mcp-growth-services (also in the official MCP
  Registry as io.github.CONN-SKILL/connskill-growth-mcp and on Glama). tools/list answered anonymously with 78 tools
  carrying inputSchema; 41 of them are paid via x402 (USDC on Base) — the hosted server forwards PAYMENT-SIGNATURE
  / X-Payment headers supplied by the caller and does not sign, while the npm server signs with X402_WALLET_KEY
  under an X402_MAX_USD per-call cap. Free tools work with no wallet.'
deployment:
  mode: both
  endpoint: https://agent.connskill.com/mcp
  transport: streamable-http
  install: npx -y @connskill/mcp-growth-services
  package: https://www.npmjs.com/package/@connskill/mcp-growth-services
  package_version: 0.3.0
  package_published: '2026-09-18'
  auth: none
  auth_note: No account or API key; free tools are open. Paid tools require x402 payment (PAYMENT-SIGNATURE header
    on the outer MCP HTTP request for the hosted server; X402_WALLET_KEY for the local server).
  verified: probed
  client_snippets:
  - claude mcp add --transport http connskill https://agent.connskill.com/mcp
  - claude mcp add connskill-growth -s user -e X402_WALLET_KEY=0x... -e X402_MAX_USD=0.50 -- npx -y @connskill/mcp-growth-services
server:
  name: connskill-growth-services
  version: 0.2.1
  protocol_version: '2025-06-18'
  capabilities:
    tools:
      listChanged: false
  transport: http
  url: https://agent.connskill.com/mcp
  instructions_excerpt: 'Pay-per-call market data and actions for agents (x402, USDC on Base). Free tools work as-is.
    Standard-x402 first purchase: repeat the same tool call with PAYMENT-SIGNATURE (legacy X-Payment is also forwarded)
    in the outer MCP HTTP headers. Manual X-Payment-Tx purchase: before transferring, confirm the target supports
    manual payment, uses JSON, and its wallet-proof query contains only ref keys (repeated ref keys keep their exact
    order). A transaction hash alone does not prove ownership. After transfer, obtain a free challenge by direct
    HTTP POST /v1/payments/challenge with purpose purchase, add'
local:
  name: '@connskill/mcp-growth-services'
  transport: stdio
  install: npx -y @connskill/mcp-growth-services
  bin: connskill-growth-mcp
  source: https://github.com/CONN-SKILL/connskill-growth-mcp
  license: MIT
  registry_record: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.CONN-SKILL%2Fconnskill-growth-mcp/versions/latest
  env:
    X402_WALLET_KEY: Base private key holding USDC (enables paid calls; optional)
    X402_MAX_USD: per-call USDC cap, default 1.00
    X402_ORIGIN: default https://agent.connskill.com
    X402_PAY_TO: expected Base recipient
    X402_STATE_DIR: ~/.local/state/connskill-mcp
