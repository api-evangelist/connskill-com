  - smsOrder
  - smsRentalOrder
  - smmOrder
  - euChat
  - euEmbed
  - mailInbox
  - chainState
  - chainCall
  - analyticsSite
  - analyticsSiteRenew
  scope_note: applies to the 41 paid (x402) operations — the mutating surface that costs money. The 20 free POST
    operations (wishlist, board, directory-submit, sms-status/cancel, smm-status/refill/cancel, mail-messages, support,
    payments/challenge) document no replay protection.
  client_side: 'npm client persists payment attempts before dispatch; ''Repeating the same canonical request does
    not create another payment by default''; a new purchase of a delivered request needs confirmNewPurchase: true'
  docs: https://agent.connskill.com/news/x402-retry-without-double-payment
dry_run:
  supported: partial
  mechanism: free quote routes return the current price before any payment (localMarketCheckQuote, smsQuote, smsPricing,
    smsRentalQuote, smmQuote); every paid route's unpaid 402 challenge carries the exact amount; euChat/euEmbed
    return a request-specific quote for valid input sent without payment
  operations:
  - localMarketCheckQuote
  - smsQuote
  - smsPricing
  - smsRentalQuote
  - smmQuote
  verbatim: Read the free discovery, input and quote routes first. Paid operations return an x402 challenge carrying
    the exact amount, asset, network and recipient. Prices can vary with selected tier, inputs or usage; use the
    actual challenge before approving payment. Support is free and uses a separate wallet ownership signature. Preserve
    the original request and payment proof for redelivery; never pay again for an unresolved purchase.
reversibility:
  grade: documented
  coverage: partial
  summary: 'Two order types can be cancelled inside a stated window and a claimed job auto-releases after 48 hours,
    but the buyer''s x402 payment is never reversed: ''On-chain settlement is technically final.'' Data calls (SERP,
    keyword, audit, chain, LLM) are irreversible by nature.'
  payment_policy_verbatim: On-chain settlement is technically final. This does not exclude statutory claims. Invalid
    input is rejected before settlement; failed delivery must be resolved through the delivery policy and support.
  surfaces:
  - write: smsOrder
    reversal: smsCancel
    window_verbatim: Free. Cancels a rented number that received no code yet (provider-side refund of our cost;
      the x402 payment itself is not refunded). (free, no payment cycle)
    window: while the rented number has received no code yet
    money: provider-side cost refund to the operator; the x402 payment is NOT refunded to the buyer
    docs: https://agent.connskill.com/.well-known/agent-card.json (skill sms-cancel); openapi/connskill-com-openapi.yml#/paths/~1sms~1v1~1sms-cancel
  - write: smmOrder
    reversal: smmCancel
    window_verbatim: Cancel an order that has not started yet (free; refund lands as panel credit, see hint)
    window: before the order has started; otherwise 409 cancel_rejected
    money: refund as panel credit, not USDC
    docs: openapi/connskill-com-openapi.yml#/paths/~1smm~1v1~1smm-cancel
  - write: smmOrder
    reversal: smmRefill
    window_verbatim: Request a refill for a delivered order (free; only for services that report refill:true)
    kind: remedy, not reversal
    docs: openapi/connskill-com-openapi.yml#/paths/~1smm~1v1~1smm-refill
  - write: boardPost
    reversal: boardClose
    window: null
    window_verbatim: Close your own job (free, needs the posterSecret you got when posting)
    docs: openapi/connskill-com-openapi.yml#/paths/~1v1~1board~1close
  - write: boardClaim
    reversal: automatic release
    window_verbatim: You get a claimSecret and 48 hours before the job returns to the board
    docs: openapi/connskill-com-openapi.yml#/paths/~1v1~1board~1claim
  - write: smsRentalOrder / mailInbox / analyticsSite / analyticsSiteRenew / directoryActivate
    reversal: null
    note: time-boxed purchases (1 or 7 days, 7 days, 30 days, one-time listing fee) with no cancel operation
  - write: paid data calls (SERP, keyword, backlinks, audits, trust/exposure checks, chain-state/call, eu-chat/eu-embed)
    reversal: null
    note: read-type purchases; the only recovery is private redelivery of the retained result (no second payment)
      and wallet support for undelivered or unclear purchases
  - write: supportDiscountClaim
    reversal: null
    note_verbatim: Issuing an entitlement does not redeem it, transfer money, close the delivery claim or promise
      a refund. Discounts remain disabled until an explicit operator policy and checkout integration are active.
  failed_delivery_path: 'POST /v1/support/challenge -> POST /v1/support/tickets with purchaseId (https://agent.connskill.com/support);
    support policy: ''The paid delivery claim remains valid. Do not pay again for the same unresolved purchase.'''
