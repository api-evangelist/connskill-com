description: 'Cross-cutting runtime semantics of CONNSKILL Growth Services: payment-gated access instead of API
  keys, request-fingerprint idempotency for paid purchases, per-lane pagination styles, a plain {error, hint} envelope,
  status-only rate limiting, and a reversibility posture where orders can be cancelled inside a stated window but
  the on-chain payment is final.'
base_url: https://agent.connskill.com
api_style: REST over HTTPS, JSON request bodies, JSON responses; plus MCP (Streamable HTTP) and A2A (JSON-RPC) on
  the same host
authentication:
  scheme: none for free routes; x402 payment proof (PAYMENT-SIGNATURE, legacy X-Payment) for paid routes; Sign-In-With-X
    wallet proof (EIP-191, one use, 5 minutes, bound to method+path+body) for support and private redelivery
  api_keys: false
  accounts: false
  verbatim: No account or API key. Manual first purchases and private redelivery require a free Sign-In-With-X wallet
    proof from POST /v1/payments/challenge.
  detail: authentication/connskill-com-authentication.yml
payment:
  protocol: x402 v2
  asset: USDC (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913)
  network: Base eip155:8453
  pay_to: '0x43B85AE58f0A2505c710Bc715d6f3EB16b1f63dE'
  model: pay-per-call via x402 — no account, no API key, no signup
  flow_verbatim: 1. Send the request. Unpaid, it answers HTTP 402 with the exact price in accepts[0].amount (micro-USDC,
    so 30000 = 0.03 USDC) and the address in accepts[0].payTo. 2. Pay that amount in USDC on Base (eip155:8453)
    with an EIP-3009 authorization. 3. Send the SAME request with the PAYMENT-SIGNATURE header for the first purchase.
  free_sample: 'One free sample per endpoint per UTC day: add the header x-free-sample: 1 on any endpoint priced
    0.15 USDC or less.'
  discovery: https://agent.connskill.com/.well-known/x402
idempotency:
  supported: true
  coverage: partial
  mechanism: 'request fingerprint + payment references: a retained result is redelivered for the same logical request
    without a second payment; the x402 payment-identifier extension is the recommended client-side key'
  verbatim: A fresh wallet proof bound to the exact original request and payment references can retrieve its retained
    private result without another payment.
  redelivery_verbatim: Private redelivery only reads a retained result. A missing result or uncertain purchase remains
    held for wallet support; it never starts another provider order.
  retention: general redelivery window defaults to 24 hours; sensitive responses (EU AI output, confirmations containing
    access secrets) default to a 15-minute access window (privacy page)
  scope:
  - serpReport
  - directoryActivate
  - keywordMetrics
  - trustCheck
  - exposureCheck
  - exposureCheckEmail
  - domainSecurityCheck
  - keywordMetricsMulti
  - keywordIdeas
  - rankedKeywords
