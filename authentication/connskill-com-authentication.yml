docs: https://agent.connskill.com/llms.txt
description: >-
  CONNSKILL Growth Services has no accounts and no API keys. Access is gated three ways: free routes are open;
  paid routes are gated by x402 payment (an unpaid request answers 402 with the exact price, and the same request
  is repeated with a PAYMENT-SIGNATURE header carrying an EIP-3009 USDC authorization on Base); and the private
  support / redelivery / manual-purchase routes require a Sign-In-With-X wallet proof — a one-use, five-minute
  EIP-191 signature over a server-issued challenge bound to the method, path and canonical JSON body. The MCP and
  A2A surfaces inherit the same model: the hosted MCP server forwards payment headers supplied by the caller and
  the A2A card declares no securitySchemes.
verbatim: >-
  No account or API key. Manual first purchases and private redelivery require a free Sign-In-With-X wallet proof
  from POST /v1/payments/challenge.
