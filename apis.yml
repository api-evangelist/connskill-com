aid: connskill-com
name: CONNSKILL GmbH & Co. KG
description: CONNSKILL GmbH & Co. KG is a web design, branding and marketing agency in Traunstein, Germany (HRA 14164, Amtsgericht
  Traunstein) that also builds and operates CONNSKILL Growth Services at agent.connskill.com — a pay-per-call marketplace
  for AI agents. It sells Google SERP and keyword research data, site audits, backlinks and competitor intelligence, SMS verification
  numbers and US number rentals, receive-only e-mail inboxes, social marketing orders, OpenAI-compatible LLM chat and embeddings
  hosted in Germany, x402 seller trust checks, leak exposure and domain security grades, read-only EVM chain data and cookieless
  website analytics, plus a free marketplace layer (wishlist, job board, curated x402 directory, published conformance reports).
  Every call is priced individually and paid in USDC on Base via x402 with no account or API key. The surface is published
  as OpenAPI 3.1, an A2A agent card, a hosted MCP endpoint and an npm MCP server, llms.txt, ai-plugin.json and an x402 discovery
  document.
