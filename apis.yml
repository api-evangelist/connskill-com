- aid: connskill-com:connskill-growth-services-mcp-server
  name: CONNSKILL Growth Services MCP Server
  description: 'Model Context Protocol surface for the same catalogue: a hosted Streamable-HTTP endpoint at agent.connskill.com/mcp
    (protocol 2025-06-18, serverInfo connskill-growth-services 0.2.1, POST-only, 78 tools returned anonymously by tools/list,
    41 paid via x402 payment headers forwarded from the caller) and a local stdio server published as @connskill/mcp-growth-services
    on npm and in the official MCP Registry (signs payments with X402_WALLET_KEY under an X402_MAX_USD per-call cap, persistent
    purchase-attempt store so a retried request is never paid twice).'
