apis:
- aid: connskill-com:connskill-growth-services-mcp-server
  name: CONNSKILL Growth Services MCP Server
  description: >-
    Model Context Protocol surface for the same catalogue: a hosted Streamable-HTTP endpoint at agent.connskill.com/mcp
    (protocol 2025-06-18, serverInfo connskill-growth-services 0.2.1, POST-only, 78 tools returned anonymously
    by tools/list, 41 paid via x402 payment headers forwarded from the caller) and a local stdio server
    published as @connskill/mcp-growth-services on npm and in the official MCP Registry (signs payments
    with X402_WALLET_KEY under an X402_MAX_USD per-call cap, persistent purchase-attempt store so a retried
    request is never paid twice).
  image: https://agent.connskill.com/icon.png
  humanURL: https://github.com/CONN-SKILL/connskill-growth-mcp
  baseURL: https://agent.connskill.com/mcp
  type: MCP
  position: Producing
  tags:
  - MCP
  - AI Agents
  - x402
  - SEO
  properties:
  - type: MCPServer
    url: mcp/connskill-com-mcp.yml
    name: MCP manifest (hosted Streamable HTTP + npm stdio; live tools/list captured)
  - type: MCPServer
    url: https://agent.connskill.com/mcp
    name: Hosted MCP endpoint (POST JSON-RPC; tools/list open, paid tools via x402)
  - type: ToolCrosswalk
    url: mcp/connskill-com-tool-crosswalk.yml
  - type: Documentation
    url: https://github.com/CONN-SKILL/connskill-growth-mcp
  - type: Packages
    url: packages/connskill-com-packages.yml
- aid: connskill-com:connskill-growth-services-a2a-agent
  name: CONNSKILL Growth Services A2A Agent
  description: >-
    A2A merchant agent (protocolVersion 0.3.0, JSON-RPC at agent.connskill.com/a2a) whose card at /.well-known/agent-card.json
    (also served at the legacy /.well-known/agent.json) lists 47 skills mirroring the REST resources —
    SMS numbers, social orders, the SEO/SERP research line, EU-hosted LLM, mail inboxes, directory and
    on-chain data — with a required a2a-x402 v0.2 extension: paid skills return a payment-required task
    and settle with an EIP-3009 USDC authorization on Base. No securitySchemes: payment, not identity,
    gates the paid skills.
  image: https://agent.connskill.com/icon.png
  humanURL: https://agent.connskill.com/
  baseURL: https://agent.connskill.com/a2a
