                - shown
                - offset
                - limit
                - hasMore
                - services
                properties:
                  ok:
                    const: true
                  total:
                    type: integer
                    minimum: 0
                  matched:
                    type: integer
                    minimum: 0
                  shown:
                    type: integer
                    minimum: 0
                  offset:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
                  hasMore:
                    type: boolean
                  services:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - serviceId
                      - name
                      - category
                      - ratePer1000Usd
                      - sellPer1000Usd
                      - min
                      - max
                      - refill
                      - cancel
                      - providerType
                      - providerDripfeed
                      - gatewayDripfeed
                      - gatewaySupport
                      properties:
                        providerType:
                          type:
                          - string
                          - 'null'
                          maxLength: 128
                        providerDripfeed:
                          type:
                          - boolean
                          - 'null'
                        gatewayDripfeed:
                          const: false
                        gatewaySupport:
                          type: object
                          additionalProperties: false
                          required:
                          - status
                          - reason
                          - inputFields
                          properties:
                            status:
                              type: string
                              enum:
                              - basic
                              - unsupported
                              - unknown
                            reason:
                              type: string
                              enum:
                              - basic_link_quantity_contract_only
                              - provider_type_unknown
                              - provider_type_not_integrated
                            inputFields:
                              type: array
                              items:
                                type: string
                                enum:
                                - serviceId
                                - link
                                - quantity
                        serviceId:
                          type:
                          - integer
                          - string
                        name:
                          type: string
                          maxLength: 2000
                        category:
                          type: string
                          maxLength: 500
                        ratePer1000Usd:
                          type:
                          - number
                          - 'null'
                        sellPer1000Usd:
                          type:
                          - number
                          - 'null'
                        min:
                          type:
                          - number
                          - 'null'
                        max:
                          type:
                          - number
                          - 'null'
                        refill:
                          type: boolean
                        cancel:
                          type: boolean
        '400':
          description: Invalid or repeated known parameter; never reflects its value.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                - parameter
                properties:
                  error:
                    const: invalid_catalogue_parameter
                  parameter:
                    type: string
                    enum:
                    - q
                    - category
                    - categoryExact
                    - sellable
                    - limit
                    - offset
        '502':
          description: Provider catalogue unavailable or malformed, without provider response details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
