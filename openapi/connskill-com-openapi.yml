  /ai/v1/eu-chat:
    post:
      operationId: euChat
      summary: LLM chat completion hosted in Germany (no training on inputs; content excluded from usage logs; temporary
        redelivery cache), OpenAI-compatible with tool use (paid)
      tags:
      - EU-LLM
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.005000'
          max: '0.080000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messages
              description: Unknown top-level fields are ignored and are neither priced nor sent to the provider.
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 64
                  description: OpenAI-style chat messages [{role, content}]
                model:
                  type: string
                  enum:
                  - gpt-oss-120b
                  - Qwen3.6-35B-A3B-FP8
                  - Ministral-3-14B-Instruct-2512
                  default: gpt-oss-120b
                max_tokens:
                  type: integer
                  minimum: 256
                  default: 1024
                  maximum: 2048
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                tools:
                  type: array
                  maxItems: 32
                  description: OpenAI-style tool definitions [{type:"function", function:{name, description, parameters}}]
                tool_choice:
                  description: '"auto" | "none" | "required" | {type:"function", function:{name}}'
                response_format:
                  type: object
                  description: e.g. {type:"json_object"}
                top_p:
                  type: number
                  minimum: 0
                  maximum: 1
                stop:
                  type: array
                  items:
                    type: string
                  maxItems: 4
                seed:
                  type: integer
      responses:
        '200':
          description: Completion + usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  model:
                    type: string
                  message:
                    type: string
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
              example:
                status: delivered
                model: gpt-oss-120b
                message: GDPR Article 6 lists six lawful bases for processing …
                usage:
                  prompt_tokens: 214
                  completion_tokens: 380
        '402':
          description: Payment required. An empty unpaid request returns catalogue metadata at the base price; submit
            valid input without payment to obtain the request-specific quote before signing.
