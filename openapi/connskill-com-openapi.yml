        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        description: true filters by configured purchase-cost cap at the minimum valid quantity; false applies no
          sellability filter. Not an availability or delivery guarantee.
      responses:
