      - name: q
        in: query
        schema:
          type: string
          maxLength: 500
        description: Case-insensitive words; every word must occur in name or category. Search stays local to the
          catalogue.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        description: Decimal integer; no empty, signed, fractional, exponent or leading-zero representation.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
        description: Zero-based offset into filtered results. Provider ordering is preserved; pages are not a locked
          snapshot.
