        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - purpose
              - address
              - request
              properties:
                purpose:
                  type: string
                  enum:
                  - purchase
                  - redelivery
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                request:
                  type: object
                  additionalProperties: false
                  required:
                  - method
                  - url
                  - headers
                  - body
                  properties:
                    method:
                      type: string
                      enum:
                      - POST
                    url:
                      type: string
                      description: Exact public path including mount. Only ref query parameters are accepted; preserve
                        their original order and percent-encoded bytes. Check this contract before paying.
                    headers:
                      type: object
                      additionalProperties: false
                      properties:
                        x-payment-tx:
                          type: string
                        payment-signature:
                          type: string
                        x-payment:
                          type: string
                      description: The exact target payment-reference headers. Purchase requires only x-payment-tx.
                        Redelivery may use a nonce-only base64 payload.authorization.nonce reference; no new spending
                        authorization is needed.
                    body:
                      description: The complete target JSON body, with no omitted or replaced fields.
      responses:
        '200':
          description: Free challenge; no funds moved
        '400':
          description: Malformed request or unsupported target
        '403':
          description: Purpose not allowed for target
        '405':
          description: Use POST
        '408':
          description: Request body timed out
        '413':
          description: Request too large
        '415':
          description: Use uncompressed UTF-8 JSON
        '429':
          description: Challenge rate limit
        '503':
          description: Wallet authentication unavailable; no access granted
