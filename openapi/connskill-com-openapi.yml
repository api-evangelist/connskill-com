  /v1/directory:
    get:
      operationId: directoryBoard
      summary: Curated DE/EU marketplace of external x402 services — the approved listings (free)
      tags:
      - Directory
      security: []
      responses:
        '200':
          description: Approved partner listings, plus how to submit your own
  /v1/directory-submit:
    post:
      operationId: directorySubmit
      summary: Submit your x402 endpoint for listing in the curated directory (free)
      tags:
      - Directory
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - description
              properties:
                url:
                  type: string
                  description: Public https URL of your paid x402 endpoint — an unpaid request must answer HTTP
                    402
                description:
                  type: string
                  maxLength: 500
                  description: What your endpoint delivers
                category:
                  type: string
                  maxLength: 50
                  description: e.g. seo, sms, llm, data
                price:
                  type: string
                  maxLength: 40
                  description: Price hint shown on the listing, e.g. "0.10"
                contact:
                  type: string
                  maxLength: 160
                  description: Optional — never shown publicly
      responses:
        '200':
          description: Stored as pending (human review). Keep the returned id — you need it for /v1/directory-status
            and /v1/directory-activate.
  /v1/directory-status:
    get:
      operationId: directoryStatus
      summary: Check the review status of a directory submission by id (free)
      tags:
      - Directory
      security: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The id returned by directory-submit
      responses:
        '200':
          description: pending (in review), accepted (pay the listing fee to go live), approved (live) or rejected
  /v1/directory-activate:
    post:
      operationId: directoryActivate
      summary: Activate an accepted directory listing — one-time x402 listing fee, then your endpoint is live in
        the curated DE/EU marketplace
      tags:
      - Directory
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '3.000000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: Submission id returned by /v1/directory-submit; must be in status "accepted" (human
                    review passed) — check GET /v1/directory-status?id=…
      responses:
        '200':
          description: Listing activated — live in /directory and /v1/directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
                  liveAt:
                    type: string
              example:
                status: activated
                id: m1abc2def3gh
                liveAt: https://agent.connskill.com/directory
        '402':
          description: Payment Required
  /health:
    get:
      summary: Service status (free)
      security: []
      responses:
        '200':
          description: OK
  /status.json:
    get:
      operationId: publicServiceStatus
      summary: Process observations and published maintenance notices (free)
      description: Served by the public gateway. Check timestamps; missing or expired observations remain unknown.
        Reachability and a free preflight do not prove a paid delivery. Planned window end does not confirm resolution.
      security: []
      x-free: true
      responses:
        '200':
          description: Bounded public status projection
          content:
            application/json:
              schema:
                type: object
                required:
                - schema
                - generatedAt
                - maintenance
                - services
                - notices
                properties:
                  schema:
                    type: string
                    enum:
                    - connskill-public-status/1
                  generatedAt:
                    type: string
                    format: date-time
                  maintenance:
                    type: object
                  services:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                  notices:
                    type: array
                    maxItems: 20
                    items:
                      type: object
        '503':
          description: Current status unavailable; do not infer zero failures or successful deliveries
  /v1/keyword-metrics:
    post:
      operationId: keywordMetrics
      summary: 'Keyword demand check for up to 1000 chosen terms: search volume, CPC, advertising competition and
        available monthly history from Google Ads data. Advertising competition is not organic SEO difficulty.'
      tags:
      - SEO
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.150000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - keywords
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1000
                  description: Keywords to look up. A single string is also accepted and treated as a one-element
                    list.
                location_code:
                  type: integer
                  default: 2276
                language_code:
                  type: string
                  default: de
            example:
              keywords:
              - webdesign rosenheim
              - seo agentur
              location_code: 2276
              language_code: de
      responses:
        '200':
          description: Report delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        keyword:
                          type: string
                        searchVolume:
                          type: integer
                        cpc:
                          type: number
                        competition:
                          type: number
                        monthly:
                          type: array
                          items:
                            type: object
                            properties:
                              year:
                                type: integer
                              month:
                                type: integer
                              searchVolume:
                                type: integer
              example:
                status: delivered
                items:
                - keyword: webdesign rosenheim
                  searchVolume: 320
                  cpc: 4.1
                  competition: 0.62
                  monthly:
                  - year: 2026
                    month: 6
                    searchVolume: 340
        '402':
          description: Payment Required
  /v1/trust-check:
    post:
      operationId: trustCheck
      summary: 'x402 seller trust check before you pay: probes the live 402, reads USDC inflow to payTo on Base,
        counts payers and flags self-dealing (operator paying itself) - verdict green/yellow/red with reasons and
        the window it could read'
      tags:
      - SEO
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.050000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - origin
              properties:
                origin:
                  type: string
                  minLength: 4
                  description: Bare host of the x402 service to check, e.g. agent.connskill.com
            example:
              origin: agent.connskill.com
      responses:
        '200':
          description: Report delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  origin:
                    type: string
                  probe:
                    type: object
                    properties:
                      x402_valid:
                        type: boolean
                      x402Version:
                        type: integer
                      network:
                        type: string
                      payTo:
                        type: string
                      http_ms:
                        type: integer
                  chain:
                    type: object
                    properties:
                      inflowUsdc:
                        type: number
                      payers:
                        type: integer
                      payersSelfDealing:
                        type: integer
                      selfDealingShare:
                        type: number
                      windowDays:
                        type: integer
                  verdict:
                    type: string
              example:
                status: delivered
                origin: https://agent.connskill.com
                probe:
                  x402_valid: true
                  x402Version: 2
                  network: eip155:8453
                  payTo: 0x43B8...
                  http_ms: 240
                chain:
                  inflowUsdc: 6.87
                  payers: 3
                  payersSelfDealing: 1
                  selfDealingShare: 0.31
                  windowDays: 14
                verdict: green
        '402':
          description: Payment Required
